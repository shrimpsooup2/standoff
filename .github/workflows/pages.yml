# Publishes the client to GitHub Pages.
#
# The game engine is plain ES modules living under public/, so the whole thing
# runs in the browser with no server: ONE DEVICE (pass-and-play), AGAINST THE
# GHOSTS and browser-hosted multiplayer all work on Pages.
#
# This deploys whatever the repository's default branch is, whatever it is
# called — hard-coding "main" means the workflow silently never runs on a repo
# whose default branch is called something else.

name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop Pages from running Jekyll over it
        run: touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
