<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>STANDOFF</title>
<meta name="description" content="A game of trust, betrayal and organised crime, told one night at a time. Chapter 1: Sal's Ledger." />
<meta name="theme-color" content="#164031" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23164031'/%3E%3Crect x='8' y='5' width='16' height='22' rx='2' fill='%23f2e8d5'/%3E%3Ctext x='16' y='23' font-size='16' font-family='Georgia,serif' font-weight='bold' fill='%23a8232b' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header id="chrome" class="chrome hidden">
    <div class="chrome-left">
      <span class="wordmark">STANDOFF</span>
      <span class="chip" id="roomChip"></span>
    </div>
    <div class="chrome-mid">
      <span class="phase-label" id="phaseLabel"></span>
      <div class="timer" id="timer"><div class="timer-fill" id="timerFill"></div></div>
    </div>
    <div class="chrome-right">
      <span class="chip bag" id="bagChip" title="The Bag"></span>
      <span class="chip file" id="fileChip" title="Prout’s Case File"></span>
      <span class="chip money" id="moneyChip" title="Your cash"></span>
      <button class="ghost-btn" id="dossierBtn" title="Your job, your secret, your offers">DOSSIER</button>
    </div>
  </header>

  <aside id="rail" class="rail hidden" aria-label="The table"></aside>

  <main id="app" aria-live="polite"></main>

  <div id="dock"></div>
  <div id="modal"></div>
  <div id="link" class="link hidden" role="status"></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
